name: Build and deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      image_repository: ${{ steps.release.outputs.image_repository }}
    steps:
      - id: release
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="$CI_SHA"
          case "$sha" in *[!0-9a-fA-F]*|'') echo "Invalid commit SHA" >&2; exit 1 ;; esac
          if [ "${#sha}" -ne 40 ]; then echo "A full 40-character SHA is required" >&2; exit 1; fi
          echo "image_tag=${sha,,}" >> "$GITHUB_OUTPUT"
          echo "image_repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexthire" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.image_tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.release.outputs.image_repository }}/backend:${{ steps.release.outputs.image_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/DockerFile
          push: true
          tags: ${{ steps.release.outputs.image_repository }}/frontend:${{ steps.release.outputs.image_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure verified SSH host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy immutable release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          IMAGE_REPOSITORY: ${{ needs.publish.outputs.image_repository }}
        run: |
          printf -v remote_command 'cd %q && git fetch origin %q && git checkout --detach %q && IMAGE_REPOSITORY=%q IMAGE_TAG=%q PUBLIC_BASE_URL=%q RUN_DEPLOYMENT_SMOKE=true ./scripts/deploy.sh' \
            "$DEPLOY_PATH" "$IMAGE_TAG" "$IMAGE_TAG" "$IMAGE_REPOSITORY" "$IMAGE_TAG" "$PUBLIC_BASE_URL"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
