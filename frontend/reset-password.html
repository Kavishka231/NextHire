<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password | NextHire</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page login-page">
<nav>
  <a class="logo brand-mark" href="index.html"><span class="brand-icon">N</span>NextHire</a>
  <div class="nav-actions">
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark and light theme">
      <span class="toggle-sun" aria-hidden="true"></span>
      <span class="toggle-moon" aria-hidden="true"></span>
    </button>
    <a href="login.html">Back to login</a>
  </div>
</nav>

<main class="auth-layout login-layout">
  <section class="auth-visual" aria-hidden="true">
    <span class="eyebrow">Account recovery</span>
    <h1>Choose a new password.</h1>
    <p>Reset links expire after 30 minutes and can only be used once.</p>
  </section>

  <div class="form-box auth-shell login-card">
    <div class="login-card-head">
      <span class="eyebrow">Secure reset</span>
      <h2>Reset your password</h2>
      <p class="auth-copy">Use at least eight characters and do not reuse an old password.</p>
    </div>
    <div id="alertBox" class="alert" role="status"></div>
    <form id="resetPasswordForm" class="login-form" novalidate>
      <div class="password-field">
        <label for="newPassword">New password
          <input name="newPassword" id="newPassword" type="password" autocomplete="new-password" required minlength="8">
        </label>
        <button class="toggle-password" type="button" data-target="newPassword" aria-label="Show password">Show</button>
      </div>
      <div class="password-field">
        <label for="confirmPassword">Confirm password
          <input name="confirmPassword" id="confirmPassword" type="password" autocomplete="new-password" required minlength="8">
        </label>
        <button class="toggle-password" type="button" data-target="confirmPassword" aria-label="Show password">Show</button>
      </div>
      <button class="btn" type="submit">Reset password</button>
    </form>
  </div>
</main>

<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  initThemeToggle();
  initResetPassword();
</script>
</body>
</html>
