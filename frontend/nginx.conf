map $http_x_forwarded_proto $redirect_to_https {
    default 0;
    http 1;
}

map $http_x_forwarded_proto $hsts_header {
    default "";
    https "max-age=31536000; includeSubDomains";
}

map $http_x_forwarded_proto $upstream_proto {
    default $scheme;
    http http;
    https https;
}

map $http_x_forwarded_for $rate_limit_key {
    default $http_x_forwarded_for;
    "" $binary_remote_addr;
}

limit_req_zone $rate_limit_key zone=api_limit:10m rate=20r/s;
limit_req_zone $rate_limit_key zone=auth_limit:10m rate=10r/m;
limit_req_zone $rate_limit_key zone=email_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($redirect_to_https) {
        return 308 https://$host$request_uri;
    }

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_req_status 429;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        include /etc/nginx/snippets/backend-proxy.conf;
    }

    location = /ready {
        include /etc/nginx/snippets/backend-proxy.conf;
    }

    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|refresh)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        include /etc/nginx/snippets/backend-proxy.conf;
    }

    location ~ ^/api/v1/admin/email/ {
        limit_req zone=email_limit burst=5 nodelay;
        include /etc/nginx/snippets/backend-proxy.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        include /etc/nginx/snippets/backend-proxy.conf;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|webp|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
