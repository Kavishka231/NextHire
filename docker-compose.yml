services:
  db:
    image: postgres:15.13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexthire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexthire}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  migrate:
    build: ./backend
    profiles: ["operations"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthire}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexthire}
    command: alembic upgrade head
    restart: "no"
    networks: [private]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthire}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexthire}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5500}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      SEED_ADMIN: ${SEED_ADMIN:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-NextHire Admin}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks: [private]

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthire}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexthire}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5500}
    command: celery -A tasks.celery_app worker --loglevel=info
    healthcheck:
      disable: true
    networks: [private]

  scheduler:
    build: ./backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthire}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexthire}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5500}
    command: celery -A tasks.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    networks: [private]

  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5500}:80"
    networks: [private]

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    networks: [private]

  grafana:
    image: grafana/grafana:13.0.4
    profiles: ["observability"]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-use}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [private]

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:

networks:
  private:
    driver: bridge
